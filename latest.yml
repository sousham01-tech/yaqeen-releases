releaseNotes: 'نسخة 1.2.7: قائمة الأسعار (تبويب «الأسعار» في الأفواج): السعر يُقترح تلقائياً عند إنشاء فوج ويبقى قابلاً للتعديل. وتتضمن تحديثات 1.2.6: التسجيل في عدة أفواج من مستوى التلميذ مع البحث؛ تعديل معلومات التلميذ؛ نافذة قبض مفصلة لكل فوج مع تنبيه عند الدفع المسبق واقتراح استعماله؛ «لا يُحتسب» في الحضور؛ تعديل الحصص القادمة وحذف عدة حصص؛ ترتيب الأفواج حسب الطور وعرضها كقائمة؛ أشرطة البحث ثابتة في أعلى الصفحات؛ قائمة أسعار تُقترح عند إنشاء الأفواج.'
